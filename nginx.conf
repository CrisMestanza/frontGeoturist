server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 200M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA routing: cualquier ruta que no sea un archivo real carga index.html.
    # Esto es lo que evita la pantalla negra al navegar a una ruta directamente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy al backend Django para todas las llamadas /api/
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets estáticos del build de Vite: cache agresivo (excluye /media/)
    location ~* ^(?!/media/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Archivos media subidos por usuarios (debe ir después del bloque de assets)
    location /media/ {
        alias /app/media/;
    }
}
